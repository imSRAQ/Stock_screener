<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shape Screener</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#13151a;
  --bg-panel:#1a1d24;
  --bg-row:#1e2129;
  --bg-row-hover:#252a34;
  --border:#2a2e38;
  --text:#e8e6e1;
  --text-dim:#7a8088;
  --text-faint:#4a4f59;
  --green:#2ea35a;
  --green-dim:#1d6b3c;
  --red:#d6473f;
  --red-dim:#8c3530;
  --amber:#e8a23d;
  --amber-dim:#7a5826;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{
  max-width:1180px;
  margin:0 auto;
  padding:28px 20px 60px;
}

/* ---------- header ---------- */
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:24px;
  gap:20px;
  flex-wrap:wrap;
}
.title-block .eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.12em;
  color:var(--amber);
  text-transform:uppercase;
  margin-bottom:6px;
}
.title-block h1{
  font-size:22px;
  font-weight:700;
  letter-spacing:-0.01em;
}
.title-block .sub{
  color:var(--text-dim);
  font-size:13px;
  margin-top:4px;
}
.load-controls{
  display:flex;
  gap:8px;
  align-items:center;
}
.btn{
  font-family:var(--sans);
  font-size:13px;
  font-weight:600;
  padding:9px 16px;
  border-radius:6px;
  border:1px solid var(--border);
  background:var(--bg-panel);
  color:var(--text);
  cursor:pointer;
  transition:background 0.15s, border-color 0.15s;
}
.btn:hover{background:var(--bg-row-hover); border-color:var(--text-faint);}
.btn.primary{background:var(--amber); color:#1a1407; border-color:var(--amber);}
.btn.primary:hover{background:#f0ad52;}
input[type=file]{display:none;}

/* ---------- reference panel ---------- */
.ref-panel{
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:20px 22px;
  margin-bottom:20px;
  display:grid;
  grid-template-columns:1fr 280px;
  gap:24px;
  align-items:center;
}
.ref-info .label{
  font-family:var(--mono);
  font-size:11px;
  color:var(--amber);
  letter-spacing:0.08em;
  text-transform:uppercase;
  margin-bottom:6px;
}
.ref-info .ticker{
  font-family:var(--mono);
  font-size:28px;
  font-weight:700;
  letter-spacing:-0.01em;
}
.ref-info .meta{
  font-family:var(--mono);
  font-size:12px;
  color:var(--text-dim);
  margin-top:8px;
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}
.ref-info .meta span b{color:var(--text);font-weight:600;}
/* *** NEW: market cap badge styling *** */
.mcap-badge{
  font-family:var(--mono);
  font-size:11px;
  color:var(--text-dim);
}
.mcap-na{color:var(--text-faint); font-style:italic;}
.ref-chart{height:90px;}

/* ---------- filter bar ---------- */
.filter-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  padding:0 4px;
  flex-wrap:wrap;
  gap:10px;
}
.filter-bar .count{
  font-family:var(--mono);
  font-size:12px;
  color:var(--text-dim);
}
.filter-bar .count b{color:var(--text);}
.sort-controls{
  display:flex;
  gap:6px;
  font-family:var(--mono);
  font-size:11px;
}
.sort-btn{
  background:none;
  border:1px solid var(--border);
  color:var(--text-dim);
  padding:5px 10px;
  border-radius:5px;
  cursor:pointer;
  letter-spacing:0.03em;
  text-transform:uppercase;
}
.sort-btn.active{border-color:var(--amber); color:var(--amber);}

/* ---------- table ---------- */
.table-wrap{
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}
.t-head{
  display:grid;
  /* *** MODIFIED: added a market-cap column (90px) before similarity *** */
  grid-template-columns:34px 110px 1fr 90px 90px 90px 90px;
  gap:14px;
  padding:10px 16px;
  background:var(--bg-panel);
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--text-faint);
  border-bottom:1px solid var(--border);
}
.t-head div:nth-child(n+4){text-align:right;}
.row{
  display:grid;
  /* *** MODIFIED: matches t-head's new 7-column layout *** */
  grid-template-columns:34px 110px 1fr 90px 90px 90px 90px;
  gap:14px;
  align-items:center;
  padding:11px 16px;
  background:var(--bg-row);
  border-bottom:1px solid var(--border);
  transition:background 0.12s;
  cursor:pointer;
}
.row:last-child{border-bottom:none;}
.row:hover{background:var(--bg-row-hover);}
.row .rank{
  font-family:var(--mono);
  font-size:12px;
  color:var(--text-faint);
}
.row .ticker{
  font-family:var(--mono);
  font-size:13.5px;
  font-weight:600;
  color:var(--text);
}
.row .spark{height:36px;}
.row .num{
  font-family:var(--mono);
  font-size:13px;
  text-align:right;
}
.row .num.score{font-weight:700;}
.row .num.pos{color:var(--green);}
.row .num.neg{color:var(--red);}
.score-bar-bg{
  position:relative;
  height:4px;
  background:var(--border);
  border-radius:2px;
  margin-top:4px;
  width:64px;
  margin-left:auto;
}
.score-bar-fill{
  position:absolute;
  height:100%;
  border-radius:2px;
  background:var(--amber);
}

/* ---------- empty state ---------- */
.empty{
  text-align:center;
  padding:70px 20px;
  color:var(--text-dim);
}
.empty .big{
  font-family:var(--mono);
  font-size:42px;
  color:var(--text-faint);
  margin-bottom:14px;
}
.empty p{max-width:440px; margin:0 auto 18px; font-size:13.5px; line-height:1.6;}
.empty code{
  background:var(--bg-panel);
  border:1px solid var(--border);
  padding:2px 7px;
  border-radius:4px;
  font-family:var(--mono);
  font-size:12px;
  color:var(--amber);
}

/* ---------- footer note ---------- */
.footnote{
  margin-top:18px;
  padding:14px 16px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:8px;
  font-size:12px;
  color:var(--text-dim);
  line-height:1.6;
}
.footnote b{color:var(--text);}

@media (max-width:720px){
  .ref-panel{grid-template-columns:1fr;}
  .t-head{display:none;}
  .row{grid-template-columns:1fr; gap:8px; padding:14px 16px;}
  .row .spark{display:none;}
  .row .num{text-align:left;}
  .row .num::before{content:attr(data-label) ": "; color:var(--text-faint);}
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="title-block">
      <div class="eyebrow">NSE &middot; Daily Candles</div>
      <h1>Shape Screener</h1>
      <div class="sub">Ranks stocks by candlestick-pattern similarity to a reference uptrend</div>
    </div>
    <div class="load-controls">
      <button class="btn" id="sampleBtn">Load sample data</button>
      <button class="btn primary" id="loadBtn">Load JSON output</button>
      <input type="file" id="fileInput" accept="application/json">
    </div>
  </div>

  <div id="content">
    <div class="empty">
      <div class="big">∿</div>
      <p>No data loaded yet. Run <code>stock_similarity_screener.py</code> on your machine, then load the resulting JSON file here — or load sample data to see how this looks.</p>
    </div>
  </div>

</div>

<script>
let state = { data: null, sortKey: 'similarity_score', sortDir: -1 };

document.getElementById('loadBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const json = JSON.parse(ev.target.result);
      state.data = json;
      render();
    } catch (err) {
      alert('Could not parse that file as JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
};
document.getElementById('sampleBtn').onclick = () => {
  state.data = SAMPLE_DATA;
  render();
};

/* *** NEW: format a raw rupee market-cap figure into Indian Cr/Lakh
   notation, which is how this number is conventionally read in NSE
   contexts (e.g. "₹19,50,000 Cr" not "₹19.5 trillion"). Returns
   null for missing data so the caller can render a dash instead of 0. *** */
function formatMarketCap(rupees){
  if (rupees === null || rupees === undefined) return null;
  const crores = rupees / 1e7;
  if (crores >= 1e5) {
    return '₹' + (crores/1e5).toFixed(2) + 'L Cr';   // lakh crore, for mega-caps
  }
  if (crores >= 1) {
    return '₹' + Math.round(crores).toLocaleString('en-IN') + ' Cr';
  }
  const lakhs = rupees / 1e5;
  return '₹' + Math.round(lakhs).toLocaleString('en-IN') + ' L';
}

function sparkPath(values, w, h, pad=2){
  if (!values || values.length < 2) return '';
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const stepX = (w - pad*2) / (values.length - 1);
  return values.map((v,i) => {
    const x = pad + i*stepX;
    const y = pad + (h - pad*2) * (1 - (v - min)/range);
    return (i===0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
}


function buildSpark(refCloses, candCloses, w=120, h=36, color){
  // resample reference to candidate length for overlay comparison
  const n = candCloses.length;
  const resampledRef = [];
  for (let i=0;i<n;i++){
    const t = i/(n-1) * (refCloses.length-1);
    const lo = Math.floor(t), hi = Math.ceil(t);
    const frac = t - lo;
    resampledRef.push(refCloses[lo]*(1-frac) + refCloses[Math.min(hi,refCloses.length-1)]*frac);
  }
  const refPath = sparkPath(resampledRef, w, h);
  const candPath = sparkPath(candCloses, w, h);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none">
    <path d="${refPath}" fill="none" stroke="var(--amber)" stroke-width="1.4" stroke-opacity="0.55" stroke-dasharray="2,2"/>
    <path d="${candPath}" fill="none" stroke="${color}" stroke-width="1.8"/>
  </svg>`;
}

function render(){
  const d = state.data;
  if (!d){ return; }
  const content = document.getElementById('content');

  const refCloses = d.reference.close;
  const refTicker = d.reference.ticker.replace('.NS','');
  const lookback = d.reference.lookback_days;

  let results = (d.results || []).slice();
  results.sort((a,b) => (a[state.sortKey] - b[state.sortKey]) * state.sortDir);

  const refSpark = `<svg viewBox="0 0 280 90" width="280" height="90" preserveAspectRatio="none">
    <path d="${sparkPath(refCloses, 280, 90, 6)}" fill="none" stroke="var(--amber)" stroke-width="2"/>
  </svg>`;

  const rowsHtml = results.map((r, i) => {
    const cand = (d.candidates_close && d.candidates_close[r.ticker]) || [];
    const color = r.pct_return >= 0 ? 'var(--green)' : 'var(--red)';
    const spark = buildSpark(refCloses, cand, 130, 36, color);
    const retClass = r.pct_return >= 0 ? 'pos' : 'neg';
    const barWidth = Math.max(2, Math.min(64, (r.similarity_score/100)*64));
    // *** NEW: look up this candidate's market cap, if the screener run
    // included --with-market-cap. Falls back to a muted "n/a" dash. ***
    const capRaw = (d.market_caps && d.market_caps[r.ticker]) ?? null;
    const capDisplay = formatMarketCap(capRaw);
    const capHtml = capDisplay
      ? `<span class="mcap-badge">${capDisplay}</span>`
      : `<span class="mcap-na">n/a</span>`;
    return `
      <div class="row" data-ticker="${r.ticker}">
        <div class="rank">${String(i+1).padStart(2,'0')}</div>
        <div class="ticker">${r.ticker.replace('.NS','')}</div>
        <div class="spark">${spark}</div>
        <div class="num" data-label="Mkt Cap">${capHtml}</div>
        <div class="num score" data-label="Similarity">${r.similarity_score.toFixed(1)}
          <div class="score-bar-bg"><div class="score-bar-fill" style="width:${barWidth}px"></div></div>
        </div>
        <div class="num ${retClass}" data-label="Return">${r.pct_return >= 0 ? '+' : ''}${r.pct_return.toFixed(2)}%</div>
        <div class="num" data-label="Slope" style="color:var(--text-dim)">${(r.trend_slope*1000).toFixed(2)}‱</div>
      </div>`;
  }).join('');

  const failedNote = d.failed_count ? ` &middot; ${d.failed_count} skipped (no data)` : '';

  // *** NEW: reference's own market cap, shown in the top panel ***
  const refCapDisplay = formatMarketCap(d.reference.market_cap ?? null);

  content.innerHTML = `
    <div class="ref-panel">
      <div class="ref-info">
        <div class="label">Reference Pattern</div>
        <div class="ticker">${refTicker}</div>
        <div class="meta">
          <span><b>${lookback}</b> trading days</span>
          <span><b>${results.length}</b> uptrend matches</span>
          <span>scanned <b>${d.scanned_count || '–'}</b>${failedNote}</span>
          ${refCapDisplay ? `<span>mkt cap <b>${refCapDisplay}</b></span>` : ''}
        </div>
      </div>
      <div class="ref-chart">${refSpark}</div>
    </div>

    <div class="filter-bar">
      <div class="count">Showing <b>${results.length}</b> stocks &middot; sorted by <b>${state.sortKey.replace('_',' ')}</b></div>
      <div class="sort-controls">
        <button class="sort-btn ${state.sortKey==='similarity_score'?'active':''}" data-key="similarity_score">Similarity</button>
        <button class="sort-btn ${state.sortKey==='pct_return'?'active':''}" data-key="pct_return">Return</button>
        <button class="sort-btn ${state.sortKey==='trend_slope'?'active':''}" data-key="trend_slope">Slope</button>
      </div>
    </div>

    <div class="table-wrap">
      <div class="t-head">
        <div>#</div><div>Ticker</div><div>Shape (vs ref)</div><div>Mkt Cap</div><div>Similarity</div><div>Return</div><div>Slope</div>
      </div>
      ${rowsHtml || '<div style="padding:30px;text-align:center;color:var(--text-dim);font-size:13px;">No matches in this dataset.</div>'}
    </div>

    <div class="footnote">
      <b>Reading this screener:</b> Similarity score (0–100) measures how closely each candidate's price path
      matches the reference's shape using Dynamic Time Warping, not whether it's a good investment.
      Dashed amber line in each row is the reference pattern overlaid for comparison. Market cap is a current
      snapshot, not historical, and shows "n/a" if the screener run didn't fetch it
      (run with <code style="font-family:var(--mono);background:var(--bg);padding:1px 5px;border-radius:3px;">--with-market-cap</code>).
      Use this to shortlist candidates for your own fundamental and risk analysis — it is not trading advice.
      <br>Generated: <b>${d.generated_at ? new Date(d.generated_at).toLocaleString() : '—'}</b>
    </div>
  `;

  content.querySelectorAll('.sort-btn').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.key;
      if (state.sortKey === key) state.sortDir *= -1;
      else { state.sortKey = key; state.sortDir = -1; }
      render();
    };
  });
}
